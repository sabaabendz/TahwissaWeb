# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    avatar_directory: '%kernel.project_dir%/public/uploads/avatars'
    avatar_web_path: '/uploads/avatars'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\RecaptchaVerifier:
        arguments:
            $secretKey: '%env(RECAPTCHA_SECRET_KEY)%'

    App\Service\TravelChatbotService:
        arguments:
            $openRouterApiKey: '%env(OPENROUTER_API_KEY)%'

    # OpenStreetMap Nominatim: identify your app (https://operations.osmfoundation.org/policies/nominatim/)
    App\Service\NominatimGeocoder:
        arguments:
            $appUserAgent: 'TahwissaEvents/1.0 (mailto:%env(GEOCODER_CONTACT_EMAIL)%)'
            $defaultCountryCodes: 'tn'

    App\Service\StripeEvenementPaymentService:
        arguments:
            $stripeSecretKey: '%env(STRIPE_SECRET_KEY)%'
            $stripeWebhookSecret: '%env(STRIPE_WEBHOOK_SECRET)%'

    App\Service\WeatherService:
        arguments:
            $apiKey: '%env(OPENWEATHER_API_KEY)%'

    App\Service\CurrencyService:
        arguments:
            $httpClient: '@http_client'
            $requestStack: '@request_stack'
            $logger: '@logger'

    App\EventListener\CurrencyDetectionListener:
        arguments:
            $currencyService: '@App\Service\CurrencyService'
        tags:
            - { name: kernel.event_subscriber }

    App\Service\VoyageDescriptionGeneratorService:
        arguments:
            $openRouterApiKey: '%env(OPENROUTER_API_KEY)%'

    App\Service\VoyageInsightsService:
        arguments:
            $openRouterApiKey: '%env(OPENROUTER_API_KEY)%'

    App\Service\StripeVoyagePaymentService:
        arguments:
            $stripeSecretKey: '%env(STRIPE_VOYAGE_SECRET_KEY)%'

    App\Service\TwilioSmsService:
        arguments:
            $twilioSid: '%env(TWILIO_SID)%'
            $twilioAuthToken: '%env(TWILIO_AUTH_TOKEN)%'
            $twilioFromNumber: '%env(TWILIO_FROM_NUMBER)%'

    App\Service\EmailNotificationService:
        arguments:
            $fromAddress: '%env(MAILER_FROM)%'

    App\Service\AvatarUploaderHelper:
        arguments:
            $avatarDirectory: '%avatar_directory%'
            $avatarWebPath: '%avatar_web_path%'

    App\Service\GeminiService:
        arguments:
            $apiKey: '%env(GEMINI_API_KEY)%'
    App\Service\OpenRouterGeminiService:
        arguments:
            $apiKey: '%env(OPENROUTER_API_KEY)%'

    App\Service\ReclamationAgentService:
        arguments:
            $openRouterApiKey: '%env(OPENROUTER_API_KEY)%'
    
        
        
            