{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vérification biométrique</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h4 class="fw-bold mb-3">Vérification biométrique requise</h4>
            <p class="text-muted mb-4">
              Avant d'accéder à cette page, veuillez confirmer votre présence humaine via la caméra.
            </p>

            <div class="ratio ratio-4x3 bg-dark rounded overflow-hidden mb-3">
              <video id="preview" class="w-100 h-100" autoplay playsinline muted></video>
            </div>

            <div id="status" class="alert alert-secondary mb-3" role="alert">
              Cliquez sur Start Camera pour commencer.
            </div>

            <div class="d-flex gap-2 flex-wrap">
              <button id="startBtn" class="btn btn-primary">Start Camera</button>
              <button id="verifyBtn" class="btn btn-success" disabled>Run Verification</button>
              <button id="retryBtn" class="btn btn-outline-danger d-none">Retry</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
(function () {
  const preview = document.getElementById('preview');
  const statusBox = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const verifyBtn = document.getElementById('verifyBtn');
  const retryBtn = document.getElementById('retryBtn');

  const nextUrl = new URLSearchParams(window.location.search).get('next') || '{{ next_url|escapejs }}';
  let stream = null;

  function setStatus(type, text) {
    statusBox.className = 'alert mb-3 alert-' + type;
    statusBox.textContent = text;
  }

  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
    return '';
  }

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      preview.srcObject = stream;
      verifyBtn.disabled = false;
      setStatus('info', 'Face detection running...');
    } catch (err) {
      setStatus('danger', 'Unable to access camera. Check browser permissions.');
      retryBtn.classList.remove('d-none');
    }
  }

  async function runVerification() {
    verifyBtn.disabled = true;
    retryBtn.classList.add('d-none');
    setStatus('warning', 'No face detected');

    try {
      const response = await fetch('{% url "verify_human_api" %}', {
        method: 'POST',
        headers: {
          'X-CSRFToken': getCookie('csrftoken'),
          'Accept': 'application/json'
        }
      });

      const data = await response.json();

      if (data.success) {
        setStatus('info', 'Face detected');
        setTimeout(function () {
          setStatus('success', 'Verification successful');
        }, 300);
        setTimeout(function () {
          window.location.href = nextUrl;
        }, 900);
        return;
      }

      const msg = (data.message || '').toLowerCase();
      if (msg.includes('face')) {
        setStatus('warning', 'No face detected');
      } else {
        setStatus('danger', data.message || 'Verification failed');
      }

      verifyBtn.disabled = false;
      retryBtn.classList.remove('d-none');
    } catch (err) {
      setStatus('danger', 'Server error during verification. Please retry.');
      verifyBtn.disabled = false;
      retryBtn.classList.remove('d-none');
    }
  }

  startBtn.addEventListener('click', startCamera);
  verifyBtn.addEventListener('click', runVerification);
  retryBtn.addEventListener('click', function () {
    setStatus('secondary', 'Ready to retry.');
    verifyBtn.disabled = false;
    retryBtn.classList.add('d-none');
  });

  window.addEventListener('beforeunload', function () {
    if (!stream) return;
    stream.getTracks().forEach(function (t) { t.stop(); });
  });
})();
</script>
</body>
</html>
